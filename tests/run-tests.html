<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU engine tests – Zocadama 8051 Studio</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 2rem auto; max-width: 56rem; padding: 0 1rem; color: #12183f; }
    #summary { font-size: 1.4rem; font-weight: 800; padding: .8rem 1rem; border-radius: 10px; }
    #summary.pass { background: #d3f5ef; color: #006b62; }
    #summary.fail { background: #ffd9e0; color: #b3123a; }
    h2 { margin: 1.5rem 0 .4rem; font-size: 1.1rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: .25rem .5rem; border-bottom: 1px solid #eceefb; }
    li.pass::before { content: "PASS  "; color: #006b62; font-weight: 800; font-family: monospace; }
    li.fail::before { content: "FAIL  "; color: #b3123a; font-weight: 800; font-family: monospace; }
    #setup-problem pre { background: #fff1f4; border: 2px solid #b3123a; border-radius: 10px; padding: 1rem; white-space: pre-wrap; }
    .err { display: block; color: #b3123a; font-family: monospace; margin-left: 3.5rem; }
  </style>
</head>
<body>
  <h1>CPU engine tests</h1>
  <p>These run the engine on its own, with no simulator screen. Some tests check every possible input, so the page may take a few seconds.</p>
  <p id="summary">Running... (if this message stays, JavaScript is blocked or the files below did not load)</p>
  <div id="setup-problem" hidden></div>
  <div id="results"></div>

  <script>window.__missingScripts = [];</script>
  <script src="../engine/memory.js" onerror="__missingScripts.push('engine/memory.js')"></script>
  <script src="../engine/instructions.js" onerror="__missingScripts.push('engine/instructions.js')"></script>
  <script src="../engine/cpu.js" onerror="__missingScripts.push('engine/cpu.js')"></script>
  <script src="../engine/hex.js" onerror="__missingScripts.push('engine/hex.js')"></script>
  <script src="../engine/samples.js" onerror="__missingScripts.push('engine/samples.js')"></script>
  <script src="test-helpers.js" onerror="__missingScripts.push('tests/test-helpers.js')"></script>
  <script src="cpu.test.js" onerror="__missingScripts.push('tests/cpu.test.js')"></script>
  <script src="browser-runner.js" onerror="__missingScripts.push('tests/browser-runner.js')"></script>
  <script>
    // Start the tests only if every file loaded; otherwise explain exactly what is missing.
    (function () {
      var ready = window.Z8051 && window.Z8051.createCpu && window.Z8051Test && typeof window.runBrowserTests === "function";
      if (ready) { window.runBrowserTests(); return; }
      var box = document.getElementById("setup-problem");
      var summary = document.getElementById("summary");
      summary.textContent = "Setup problem: the tests did not start.";
      summary.className = "fail";
      box.hidden = false;
      var missing = window.__missingScripts.length ? window.__missingScripts : ["(unknown - check the browser console with F12)"];
      var lines = [
        "These files could not be loaded:",
        "  " + missing.join("\n  "),
        "",
        "This page must stay inside the simulator folder, next to these folders:",
        "  engine/   (memory.js, instructions.js, cpu.js, hex.js, samples.js)",
        "  tests/    (run-tests.html, test-helpers.js, cpu.test.js, browser-runner.js)",
        "",
        "Fix: unzip the WHOLE zip file and keep every folder exactly as it is.",
        "Do not copy single files out of the folders."
      ];
      var pre = document.createElement("pre");
      pre.textContent = lines.join("\n");
      box.appendChild(pre);
    })();
  </script>
</body>
</html>
